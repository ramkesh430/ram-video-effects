name: Render effects

# Option A: upload a video/photo (and optionally NAME.json or plan.json) into the inputs/ folder -> runs automatically.
# Option B: Actions tab -> "Render effects" -> Run workflow, and type the file path + plan.
on:
  push:
    paths:
      - "inputs/**"
  workflow_dispatch:
    inputs:
      file:
        description: "Video or photo in the repo (e.g. inputs/me.mp4 or original_photo.jpg). Empty = everything in inputs/"
        required: false
        default: ""
      plan:
        description: "Plan JSON (empty = NAME.json, then inputs/plan.json, then example_plan.json)"
        required: false
        default: ""
      commit:
        description: "Save the result into outputs/ in the repo (otherwise only as a download)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: render-effects
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install ffmpeg + Python packages
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          pip install -q -r requirements.txt

      - name: Cache models and fonts
        uses: actions/cache@v4
        with:
          path: ~/.cache/fxkit
          key: fxkit-models-v1

      - name: Download models and fonts
        run: bash install.sh

      - name: Render
        env:
          IN_FILE: ${{ github.event.inputs.file }}
          IN_PLAN: ${{ github.event.inputs.plan }}
        run: |
          ARGS=()
          if [ -n "$IN_FILE" ]; then ARGS+=("$IN_FILE"); fi
          if [ -n "$IN_PLAN" ]; then ARGS+=(--plan "$IN_PLAN"); fi
          python render_inputs.py "${ARGS[@]}"

      - name: Upload result (download from the run page)
        uses: actions/upload-artifact@v4
        with:
          name: rendered-videos
          path: outputs/*_effects.mp4

      - name: Save result into outputs/
        if: github.event_name == 'push' || github.event.inputs.commit == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outputs/*_effects.mp4
          git commit -m "Rendered effects [skip ci]" || echo "nothing to commit"
          git pull --rebase -q && git push
