name: Make Vox video

# Actions -> "Make Vox video" -> Run workflow. Writes a voiced Vox-style explainer from a script JSON
# (AI voice via edge-tts + paper background + Vox effects) into outputs/<name>.mp4
on:
  workflow_dispatch:
    inputs:
      script:
        description: "Script JSON (see vox/scripts/)"
        required: true
        default: "vox/scripts/digital_marketing_ne.json"
      commit:
        description: "Save the video into outputs/ in the repo (otherwise only as a download)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: render-effects
  cancel-in-progress: false

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install ffmpeg + Python packages
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core libgl1 libegl1 libgles2 libglib2.0-0 xvfb
          pip install -q -r requirements.txt edge-tts

      - name: Cache models and fonts
        uses: actions/cache@v4
        with:
          path: ~/.cache/fxkit
          key: fxkit-models-v1

      - name: Download models and fonts
        run: bash install.sh

      - name: Make the video
        env:
          SCRIPT: ${{ github.event.inputs.script }}
        run: |
          export MESA_GL_VERSION_OVERRIDE=3.3
          xvfb-run -a python vox/make_video.py "$SCRIPT"

      - name: Upload video (download from the run page)
        uses: actions/upload-artifact@v4
        with:
          name: vox-video
          path: outputs/*.mp4
          if-no-files-found: error

      - name: Save video into outputs/
        if: inputs.commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f outputs/*.mp4 outputs/*_plan.json
          git commit -m "Vox video: $(basename "${{ github.event.inputs.script }}" .json) [skip ci]" || echo "nothing to commit"
          git pull --rebase -q && git push
